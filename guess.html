<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
    <link rel="stylesheet" href="guess.css">
</head>
<body>
    <div class="container">
        <h1>Guess the Number</h1>
        <h2>Guess a number between 1 and 100</h2>
        <form id="guessForm">
            <p class="form-label">Enter your guess:</p>
            <input type="number" id="guessInput" min="1" max="100" required>
            <button type="submit">Submit</button>
        </form>
        <div id="result">
            <p id="messageLow" class="hidden">Your guess is too low!</p>
            <p id="messageHigh" class="hidden">Your guess is too high!</p>
            <p id="messageCorrect" class="hidden">You got it right!</p>
            <p id="guessCount">Number of guesses: 0</p>
            <p id="highScore">Best score: —</p>
        </div>
        <button id="resetBtn">Reset</button>
    </div>
    
</body>
<script src="guess.js" ></script>
</html>
